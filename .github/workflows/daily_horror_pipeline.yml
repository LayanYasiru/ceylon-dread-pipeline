name: Daily Horror Episodes

on:
  schedule:
    # 20:30 UTC = 02:00 Sri Lanka. Episodes upload as scheduled/private and go live at PUBLISH_SLOTS_UTC,
    # which leaves you a review window to delete anything you dislike.
    - cron: '30 20 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'How many episodes to make (use 1 for a test)'
        default: '2'

permissions:
  contents: write   # to commit data/state.json (which stories are already done)

concurrency:
  group: daily-horror
  cancel-in-progress: false

jobs:
  produce-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Fonts for captions
        run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-liberation fonts-dejavu-core

      - name: Install dependencies (CPU torch for the depth model)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache depth model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-depth-anything-v2-small

      - name: Produce and publish
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'scheduled' }}
          CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Ceylon Dread' }}
        run: python run_daily.py --count ${{ github.event.inputs.count || '2' }}

      - name: Commit progress (state + script history)
        if: always()
        run: |
          git config user.name "horror-bot"
          git config user.email "horror-bot@users.noreply.github.com"
          git add data/state.json data/scripts data/generated_topics.json || true
          git diff --cached --quiet || (git commit -m "chore: update episode state" && git push)

      - name: Keep shorts for manual TikTok posting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-and-thumbnails
          path: |
            output/ready/**/*_long.mp4
            output/ready/**/*short*.mp4
            output/ready/**/*_thumb.jpg
            output/ready/**/metadata.json
          retention-days: 3
          if-no-files-found: ignore
